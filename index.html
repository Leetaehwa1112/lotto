<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두쫀쿠 성격 테스트 | 나의 두바이 초콜릿 유형은?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <!-- Landing Section -->
        <section id="landing" class="screen active">
            <div class="logo-area">
                <span class="badge">Dujjonku Test</span>
                <h1>나와 어울리는<br>두바이 쫀득 쿠키는?</h1>
                <p class="desc">겉바속촉, 달콤 쌉싸름한 당신의 맛을 찾아드립니다.<br>지금 바로 확인해보세요!</p>
            </div>
            <div class="start-btn-wrapper">
                <button class="btn-primary" onclick="startQuiz()">테스트 시작하기</button>
            </div>
        </section>

        <!-- Quiz Section -->
        <section id="quiz" class="screen">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question-container">
                <span class="q-number" id="q-number">Q1.</span>
                <h2 id="question-text">질문 내용이 들어갑니다.</h2>
            </div>
            <div class="answers-container" id="answers-container">
                <!-- Buttons will be injected here -->
            </div>
        </section>

        <!-- Loading Section -->
        <section id="loading" class="screen">
            <div class="baking-animation">
                <div class="cookie-loader">🍪</div>
            </div>
            <h2>당신의 쿠키를 굽는 중...</h2>
            <p>오븐 온도를 맞추고 필링을 채우고 있습니다!</p>
        </section>

        <!-- Result Section -->
        <section id="result" class="screen">
            <div class="result-header">
                <p class="subtitle">당신의 유형은</p>
                <h1 id="result-title">결과 타이틀</h1>
            </div>

            <div class="result-card">
                <div class="result-visual" id="result-visual">
                    <!-- CSS Art or Color Block here -->
                </div>
                <div class="result-tags" id="result-tags">
                    <!-- Tags -->
                </div>
                <div class="result-desc" id="result-desc">
                    <!-- Description -->
                </div>
            </div>

            <div class="match-box">
                <div class="match-item good">
                    <span>환상의 짝꿍 🥰</span>
                    <strong id="match-good">Type A</strong>
                </div>
                <div class="match-item bad">
                    <span>환장의 궁합 🤯</span>
                    <strong id="match-bad">Type B</strong>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" onclick="shareResult()">결과 공유하기</button>
                <button class="btn-secondary" onclick="restartQuiz()">다시 테스트하기</button>
            </div>
        </section>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
